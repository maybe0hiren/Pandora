name: Build portable Pandora for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt 6 for MSVC 2022 x64
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtnetworkauth'
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run Automated Distributed Tests
        shell: pwsh
        run: |
          $env:Path = "$env:QT_ROOT_DIR/bin;$env:Path"
          $env:QT_QPA_PLATFORM = "offscreen"
          ./build/Release/PandoraTests.exe

      - name: Assemble portable folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $exe = Join-Path $PWD 'build/Release/Pandora.exe'
          if (!(Test-Path $exe)) { throw "Build did not produce $exe" }
          $out = Join-Path $PWD 'Pandora-Portable'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $exe $out
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --compiler-runtime --dir $out $exe
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }
          Copy-Item README.md $out/README.txt
          New-Item -ItemType Directory -Force -Path "$out/LICENSES" | Out-Null
          Compress-Archive -Path "$out/*" -DestinationPath 'Pandora-Portable-Windows-x64.zip' -Force

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Pandora-Portable-Windows-x64
          path: Pandora-Portable-Windows-x64.zip
          if-no-files-found: error
